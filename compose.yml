name: dxp

# No restart policy here: a dead container stays visible in docker compose ps; prod's
# ECS service restarts are the other half of that trade.
services:
  redis:
    image: redis:7-alpine
    container_name: dxp-redis
    # 1gb is the laptop-scaled figure the test conftest already starts; prod uses 2gb,
    # twice the derived 1,051.5 MiB for thirty minutes of retention.
    # noeviction is the hosting decision: the writer gets an error instead of silently
    # losing the oldest stream entries underneath a consumer.
    # save "" disables redis:7-alpine's default minute-scale snapshots; this stack chose
    # no snapshot persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  feed:
    build:
      context: ./engine
      dockerfile: Dockerfile.feed
    container_name: dxp-feed
    env_file:
      - stack.env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  store:
    build:
      context: ./engine
      dockerfile: Dockerfile.store
    container_name: dxp-store
    env_file:
      - stack.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.stack-data:/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./engine
      dockerfile: Dockerfile.api
    container_name: dxp-api
    env_file:
      - stack.env
    depends_on:
      redis:
        condition: service_healthy
    # main.build_consumer_stack() constructs a BarWriter in this process. Read-only
    # makes store the only writer into the shared root.
    volumes:
      - ./.stack-data:/data:ro
    # main.lifespan takes the Redis-consumer branch before it consults this flag, so
    # this is belt and braces rather than the mechanism.
    environment:
      DELTA_LIVE_FEED: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_ENGINE_URL: "http://localhost:8080/api"
    container_name: dxp-web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  proxy:
    image: nginx:alpine
    container_name: dxp-proxy
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
