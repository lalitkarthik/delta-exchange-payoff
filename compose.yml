name: dxp

# No restart policy here: a dead container stays visible in docker compose ps; prod's
# ECS service restarts are the other half of that trade.
services:
  redis:
    image: redis:7-alpine
    container_name: dxp-redis
    # 2gb, matching prod, because 1gb contradicts a measurement this repo already
    # published. #61 ran thirty continuous minutes of BTC+ETH and recorded 1,056.4 MiB
    # (`measured`) against #58's 1,051.5 MiB (`derived`) -- and had to raise its own
    # container from 1gb to 1.5gb at minute 18 when the curve projected past 1 GiB. Its
    # finding is quoted: "1 GiB is not enough for thirty minutes of BTC+ETH and #69's 2gb
    # is." Under `noeviction` a Redis at its ceiling refuses writes rather than evicting,
    # so 1gb here configured the stack to stall itself at steady state.
    # `measured` 2026-09-12 on this stack, which lists BTC alone: 258.75 MB at 10.3
    # minutes, growing 26.6 MB/min, projecting to ~800 MB over the full window -- it fits
    # under 1gb only because one underlying is listed, not because 1gb was right.
    # noeviction is the hosting decision: the writer gets an error instead of silently
    # losing the oldest stream entries underneath a consumer.
    # save "" disables redis:7-alpine's default minute-scale snapshots; this stack chose
    # no snapshot persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  feed:
    build:
      context: ./engine
      dockerfile: Dockerfile.feed
    container_name: dxp-feed
    env_file:
      - stack.env
    # #103: the engine's daily JSON log files live at /app/logs and nothing was mounted
    # over them, so seven hours of the only real diagnostics died with the container --
    # 146 KB in dxp-store alone, copied out by hand before it could be removed. Records
    # now also reach standard error, which docker logs reads; this is the durable copy,
    # one directory per service so four writers cannot collide on one day's file.
    volumes:
      - ./.stack-logs/feed:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  store:
    build:
      context: ./engine
      dockerfile: Dockerfile.store
    container_name: dxp-store
    env_file:
      - stack.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.stack-data:/data
    # #103: the engine's daily JSON log files live at /app/logs and nothing was mounted
    # over them, so seven hours of the only real diagnostics died with the container --
    # 146 KB in dxp-store alone, copied out by hand before it could be removed. Records
    # now also reach standard error, which docker logs reads; this is the durable copy,
    # one directory per service so four writers cannot collide on one day's file.
      - ./.stack-logs/store:/app/logs
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  discord-alerts:
    build:
      context: ./engine
      dockerfile: Dockerfile.discord-alerts
    container_name: dxp-discord-alerts
    env_file:
      - stack.env
      - path: stack.local.env
        required: false
    # #103: the engine's daily JSON log files live at /app/logs and nothing was mounted
    # over them, so seven hours of the only real diagnostics died with the container --
    # 146 KB in dxp-store alone, copied out by hand before it could be removed. Records
    # now also reach standard error, which docker logs reads; this is the durable copy,
    # one directory per service so four writers cannot collide on one day's file.
    volumes:
      - ./.stack-logs/discord-alerts:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ./engine
      dockerfile: Dockerfile.api
    container_name: dxp-api
    env_file:
      - stack.env
    depends_on:
      redis:
        condition: service_healthy
    # Read-only because store is the only writer into the shared root. Since #63,
    # main.build_consumer_stack() returns writer=None -- this process has no BarWriter
    # at all, so the mount could not write even if it were allowed to. Left read-only
    # anyway: the guarantee belongs to the mount, not to a line in main.py that a later
    # ticket could change without anyone reading this file.
    volumes:
      - ./.stack-data:/data:ro
    # #103: the engine's daily JSON log files live at /app/logs and nothing was mounted
    # over them, so seven hours of the only real diagnostics died with the container --
    # 146 KB in dxp-store alone, copied out by hand before it could be removed. Records
    # now also reach standard error, which docker logs reads; this is the durable copy,
    # one directory per service so four writers cannot collide on one day's file.
      - ./.stack-logs/api:/app/logs
    # main.lifespan takes the Redis-consumer branch before it consults this flag, so
    # this is belt and braces rather than the mechanism.
    environment:
      DELTA_LIVE_FEED: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_ENGINE_URL: "http://localhost:8080/api"
    container_name: dxp-web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  proxy:
    image: nginx:alpine
    container_name: dxp-proxy
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
