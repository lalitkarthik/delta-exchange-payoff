# The api is mounted under /api/ and the prefix is stripped by the trailing slash on
# proxy_pass. Everything else is the web app. This replaces a per-route table: the api
# declares GET /volatility and the web app has a page at /volatility, so no per-route
# table can serve both. engine/tests/test_stack_proxy.py fails if this invariant breaks.
#
# A browser served everything from one origin makes no cross-origin request, so
# main.ALLOWED_ORIGINS is untouched and no CORS code changes anywhere.
#
# FastAPI's own /docs, /redoc and /openapi.json are reachable under /api/ like any other
# api path; they are not special-cased.

# The upgrade header, mapped once. `map` is an http-context directive and conf.d/*.conf
# is included into http.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dxp_api { server api:8000; }
upstream dxp_web { server web:3000; }

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The chain socket pushes once a second for as long as a tab is open.
    proxy_read_timeout 3600s;

    # The trailing slash on proxy_pass is what strips /api: /api/chain reaches the api as
    # /chain, and /api/ws/chain as /ws/chain. Removing it silently forwards the prefix and
    # every api route 404s.
    location ^~ /api/ { proxy_pass http://dxp_api/; }

    # The proxy's own liveness, answered by nginx itself. It is deliberately NOT /health:
    # /health belongs to the web catch-all now, and the web app declares no such page, so a
    # probe against /health would 404 and read as the stack being down. It is also
    # deliberately answered here rather than proxied, so that the proxy reports healthy even
    # while api or web are still starting - which is what a container HEALTHCHECK is for.
    # The api's health through the proxy is /api/health; the store is not proxied at all and
    # is checked on its own container.
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok
"; }

    location / { proxy_pass http://dxp_web; }
}
